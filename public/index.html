<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>LEXINX HOST</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: min(700px, 94%);
            background: #171717;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 280px;
            resize: vertical;
            background: #090909;
            color: #eee;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-family: monospace;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #fff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }

        input {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: #090909;
            color: white;
            border: 1px solid #333;
            border-radius: 8px;
        }

        #result {
            display: none;
        }

        .status {
            margin-top: 12px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>LEXINX HOST</h1>

    <textarea
        id="content"
        placeholder="Nhập nội dung của bạn..."
    ></textarea>

    <button onclick="createLink()">
        CREATE LINK
    </button>

    <div id="result">

        <input id="url" readonly>

        <button onclick="copyLink()">
            COPY LINK
        </button>

    </div>

    <div class="status" id="status">
        Ready
    </div>

</div>

<script>

async function createLink() {

    const content =
        document.getElementById("content").value;

    if (!content.trim()) {
        document.getElementById("status").textContent =
            "Content is empty";
        return;
    }

    document.getElementById("status").textContent =
        "Creating...";

    try {

        const response = await fetch("/api/create", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                content: content
            })
        });

        const data = await response.json();

        if (!data.ok) {
            throw new Error(data.error);
        }

        const fullURL =
            location.origin + data.url;

        document.getElementById("url").value =
            fullURL;

        document.getElementById("result").style.display =
            "block";

        document.getElementById("status").textContent =
            "Link created";

    } catch (error) {

        document.getElementById("status").textContent =
            "Error: " + error.message;
    }
}

async function copyLink() {

    const input =
        document.getElementById("url");

    await navigator.clipboard.writeText(
        input.value
    );

    document.getElementById("status").textContent =
        "Copied";
}

</script>

</body>
  </html>
